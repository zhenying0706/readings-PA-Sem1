<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">41篇文献的证据空白与研究议程</title>
  <desc id="desc">区分现有研究较能支持的结论、证据链中的断点，以及三条可向导师讨论的研究路线。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#EEF3F7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#203C52" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow3" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#6F8797"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",Arial,sans-serif;fill:#17324D}
      .eyebrow{font-size:20px;font-weight:500;letter-spacing:2px;fill:#60798A}
      .title{font-size:42px;font-weight:500;fill:#153B5B}
      .subtitle{font-size:21px;fill:#60798A}
      .section{font-size:25px;font-weight:500}
      .section-en{font-size:17px;fill:#657D8D}
      .node-title{font-size:21px;font-weight:500}
      .node-en{font-size:15px;fill:#627989}
      .status{font-size:16px;font-weight:500}
      .small{font-size:15px;fill:#405A6C}
      .gap{font-size:18px;font-weight:500;fill:#B0523A}
      .route-title{font-size:24px;font-weight:500}
      .route-en{font-size:16px;fill:#657D8D}
      .route-item{font-size:18px;fill:#334E62}
      .takeaway{font-size:25px;font-weight:500;fill:#FFFFFF}
      .takeaway-en{font-size:18px;fill:#DCEAF2}
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg3)"/>
  <text x="80" y="66" class="eyebrow">EVIDENCE GAPS · WHAT WE KNOW, WHAT WE STILL NEED</text>
  <text x="80" y="120" class="title">真正的研究空白：证据链没有连起来</text>
  <text x="80" y="158" class="subtitle">The central gap is not a lack of studies, but a disconnected evidence chain</text>

  <!-- evidence summary -->
  <g filter="url(#shadow3)"><rect x="80" y="205" width="1640" height="115" rx="25" fill="#FFFFFF"/></g>
  <text x="120" y="246" class="section">现有研究已经较能说明</text>
  <text x="120" y="276" class="section-en">What existing research supports relatively well</text>
  <circle cx="590" cy="260" r="8" fill="#2A9D8F"/><text x="612" y="267" class="small">实施情境重要</text>
  <circle cx="830" cy="260" r="8" fill="#7662B2"/><text x="852" y="267" class="small">裁量会迁移</text>
  <circle cx="1050" cy="260" r="8" fill="#E9A23B"/><text x="1072" y="267" class="small">负担可能转移</text>
  <circle cx="1300" cy="260" r="8" fill="#E76F51"/><text x="1322" y="267" class="small">公平与程序重要</text>

  <!-- chain title -->
  <text x="80" y="380" class="section">但最关键的五个环节通常没有在同一研究中被观察</text>
  <text x="80" y="411" class="section-en">The five critical links are rarely observed together in the same study</text>

  <!-- arrows -->
  <path d="M360 515 L420 515" stroke="#C97A65" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow3)"/>
  <path d="M680 515 L740 515" stroke="#C97A65" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow3)"/>
  <path d="M1000 515 L1060 515" stroke="#C97A65" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow3)"/>
  <path d="M1320 515 L1380 515" stroke="#C97A65" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow3)"/>
  <text x="390" y="485" text-anchor="middle" class="gap">断点</text>
  <text x="710" y="485" text-anchor="middle" class="gap">断点</text>
  <text x="1030" y="485" text-anchor="middle" class="gap">断点</text>
  <text x="1350" y="485" text-anchor="middle" class="gap">断点</text>

  <!-- chain nodes -->
  <g filter="url(#shadow3)"><rect x="80" y="445" width="280" height="220" rx="24" fill="#FFFFFF"/></g>
  <rect x="80" y="445" width="280" height="10" rx="5" fill="#2E6F95"/>
  <text x="110" y="497" class="node-title">① 正式授权与制度安排</text>
  <text x="110" y="528" class="node-en">Formal authorization &amp; rules</text>
  <text x="110" y="570" class="small">常见证据：政策、访谈、案例</text>
  <text x="110" y="602" class="small">Common: policy · interview · case data</text>
  <rect x="110" y="624" width="118" height="28" rx="14" fill="#DCECF4"/>
  <text x="169" y="644" text-anchor="middle" class="status" fill="#2E6F95">相对较多</text>

  <g filter="url(#shadow3)"><rect x="420" y="445" width="260" height="220" rx="24" fill="#FFFFFF"/></g>
  <rect x="420" y="445" width="260" height="10" rx="5" fill="#3D86A3"/>
  <text x="450" y="497" class="node-title">② 任务层真实使用</text>
  <text x="450" y="528" class="node-en">Actual task-level use</text>
  <text x="450" y="570" class="small">需要：日志、采纳／修正／拒绝</text>
  <text x="450" y="602" class="small">Need: logs and user actions</text>
  <rect x="450" y="624" width="102" height="28" rx="14" fill="#FBE4DD"/>
  <text x="501" y="644" text-anchor="middle" class="status" fill="#B0523A">很少</text>

  <g filter="url(#shadow3)"><rect x="740" y="445" width="260" height="220" rx="24" fill="#FFFFFF"/></g>
  <rect x="740" y="445" width="260" height="10" rx="5" fill="#2A9D8F"/>
  <text x="770" y="497" class="node-title">③ 前线互动与异常处理</text>
  <text x="770" y="528" class="node-en">Frontline handling &amp; exceptions</text>
  <text x="770" y="570" class="small">需要：处理记录、工作负荷、纠错</text>
  <text x="770" y="602" class="small">Need: handling &amp; correction logs</text>
  <rect x="770" y="624" width="102" height="28" rx="14" fill="#FBE4DD"/>
  <text x="821" y="644" text-anchor="middle" class="status" fill="#B0523A">很少</text>

  <g filter="url(#shadow3)"><rect x="1060" y="445" width="260" height="220" rx="24" fill="#FFFFFF"/></g>
  <rect x="1060" y="445" width="260" height="10" rx="5" fill="#E9A23B"/>
  <text x="1090" y="497" class="node-title">④ 公民三类负担</text>
  <text x="1090" y="528" class="node-en">Citizen burden:</text>
  <text x="1090" y="552" class="node-en">learning · compliance · psychological</text>
  <text x="1090" y="582" class="small">需要：时间、金钱、理解与压力</text>
  <text x="1090" y="608" class="small">Need: time · money · literacy · stress</text>
  <rect x="1090" y="624" width="102" height="28" rx="14" fill="#FBE4DD"/>
  <text x="1141" y="644" text-anchor="middle" class="status" fill="#B0523A">不足</text>

  <g filter="url(#shadow3)"><rect x="1380" y="445" width="340" height="220" rx="24" fill="#FFF7F2"/></g>
  <rect x="1380" y="445" width="340" height="10" rx="5" fill="#E76F51"/>
  <text x="1410" y="497" class="node-title">⑤ 长期公共价值结果</text>
  <text x="1410" y="528" class="node-en">Long-term public-value outcomes</text>
  <text x="1410" y="570" class="small">绩效 · 公平 · 信任 · 合法性</text>
  <text x="1410" y="602" class="small">Performance · equity · trust · legitimacy</text>
  <rect x="1410" y="624" width="102" height="28" rx="14" fill="#FBE4DD"/>
  <text x="1461" y="644" text-anchor="middle" class="status" fill="#B0523A">不足</text>

  <!-- takeaway -->
  <g filter="url(#shadow3)"><rect x="200" y="705" width="1400" height="90" rx="28" fill="#153B5B"/></g>
  <text x="900" y="746" text-anchor="middle" class="takeaway">优先设计：把五个环节连成“组织—任务—前线—公民—结果”的纵向数据链</text>
  <text x="900" y="777" text-anchor="middle" class="takeaway-en">Priority design: connect organization, task, frontline, citizen, and outcome data longitudinally</text>

  <!-- routes -->
  <text x="80" y="855" class="section">向导师汇报时可选择一条主线，另外两条作为机制或结果</text>
  <text x="80" y="885" class="section-en">Choose one main route; use the other two as mechanisms or outcomes</text>

  <g filter="url(#shadow3)"><rect x="80" y="920" width="515" height="135" rx="24" fill="#FFFFFF"/></g>
  <rect x="80" y="920" width="10" height="135" rx="5" fill="#2E6F95"/>
  <text x="120" y="963" class="route-title">路线A · 组织实施</text>
  <text x="120" y="993" class="route-en">Route A · Organizational implementation</text>
  <text x="120" y="1028" class="route-item">授权／培训／任务风险 → 真实使用 → 绩效与技能</text>

  <g filter="url(#shadow3)"><rect x="643" y="920" width="515" height="135" rx="24" fill="#FFFFFF"/></g>
  <rect x="643" y="920" width="10" height="135" rx="5" fill="#E9A23B"/>
  <text x="683" y="963" class="route-title">路线B · 行政负担</text>
  <text x="683" y="993" class="route-en">Route B · Administrative burden</text>
  <text x="683" y="1028" class="route-item">数字界面 → 三类成本 → 申请／兑换／申诉与公平</text>

  <g filter="url(#shadow3)"><rect x="1206" y="920" width="514" height="135" rx="24" fill="#FFFFFF"/></g>
  <rect x="1206" y="920" width="10" height="135" rx="5" fill="#7662B2"/>
  <text x="1246" y="963" class="route-title">路线C · 治理保障</text>
  <text x="1246" y="993" class="route-en">Route C · Governance safeguards</text>
  <text x="1246" y="1028" class="route-item">解释／人工复核／申诉 → 纠错、公平、信任与合法性</text>
</svg>
